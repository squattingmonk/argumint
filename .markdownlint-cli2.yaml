# Markdown width check, run by .github/workflows/docs.yml and by editors that
# pick up this file. Only line length is enforced; the other default rules are
# off. Code blocks, tables and headings (which can't wrap) may run long, and
# a line may overflow when the overflow is one unbreakable token such as a
# URL (MD013's default).
config:
  default: false
  MD013:
    line_length: 80
    code_blocks: false
    tables: false
    headings: false

ignores:
  - CHANGELOG.md # generated by release-please
  - .claude/**
  # Generated from the setup-matt-pocock-skills templates; wrapping them would
  # split their one-line commands and churn each refresh
  - docs/agents/**
