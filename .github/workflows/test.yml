name: Test

on:
  # `push` is scoped to the long-lived branches (`main` for 1.x, `next` for
  # the next major release) so a PR branch fires `pull_request` only. Without
  # the filter both events fire and the matrix runs twice -- and the two test
  # different trees (`pull_request` builds the branch merged into the base,
  # `push` builds the branch tip alone), so which result you got was a race.
  # `paths-ignore` skips the matrix for documentation-only changes. Nothing
  # under src/ or tests/ reads a markdown file, so they can't affect a result.
  # `workflow_dispatch` has no paths filter, so a skipped run can still be
  # triggered by hand.
  push:
    branches: [main, next]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

# Pushing again to an open PR cancels the still-running check for the previous
# commit, so only the tip is ever tested. A PR groups by its number and a push
# by its branch, so a PR from `main` into `next` (syncing the two) can't cancel
# a run for a push to `main`.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # `min` is the oldest Nim argumint supports, read from argumint.nimble
        # below, so the leg's name -- and the required status checks named
        # after it -- stay the same when the minimum is raised.
        nim-version: [min, stable]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.nim-version == 'stable' }}
    # Windows runners default to pwsh; every step here is written for bash.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Nim version
        id: nim
        run: |
          if [ "${{ matrix.nim-version }}" = min ]; then
            v=$(tr -d '\r' < argumint.nimble | sed -n 's/^requires "nim >= \(.*\)"$/\1/p')
            [ -n "$v" ] || { echo "::error::no nim requirement in argumint.nimble"; exit 1; }
          else
            v=${{ matrix.nim-version }}
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # nim-lang.org publishes prebuilt binaries for Linux and Windows only, so
      # on macOS setup-nim-action falls through to downloading the source
      # tarball and running build.sh -- 214s, against 2s on ubuntu. The action
      # can't be cached transparently: it `rm -rf`s any existing install
      # directory before moving the fresh build in, so a restored cache is
      # deleted unless the action itself is skipped.
      #
      # The week bucket exists for the `stable` leg, whose version is a moving
      # target -- without it the cache would pin whatever `stable` meant the day
      # it was first written, silently defeating the point of testing against
      # it. Costs one rebuild per leg per week.
      - name: Compute weekly cache bucket
        id: week
        run: echo "v=$(date -u +%Y-%V)" >> "$GITHUB_OUTPUT"

      # Skipped on Windows: prebuilt binaries install fast there, so there's no
      # build.sh cost to recoup.
      - name: Cache Nim toolchain
        id: nim-cache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nim_runtime
          key: nim-${{ runner.os }}-${{ runner.arch }}-${{ steps.nim.outputs.version }}-${{ steps.week.outputs.v }}

      - uses: jiro4989/setup-nim-action@v2
        if: steps.nim-cache.outputs.cache-hit != 'true'
        with:
          nim-version: ${{ steps.nim.outputs.version }}

      # Mirrors the PATH the action would have set, since it was skipped above.
      - name: Use cached Nim
        if: steps.nim-cache.outputs.cache-hit == 'true'
        run: |
          echo "${{ github.workspace }}/.nim_runtime/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - run: nim --version
      - run: nimble test
