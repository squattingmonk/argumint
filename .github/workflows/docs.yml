name: Docs

# A pull request builds the docs without deploying them, so a broken doc
# comment or guide page fails review instead of the next deploy. `nimble docs`
# fails on any error `nim doc` or `md2html` reports (see `docExec` in
# argumint.nimble), and `nimble docscheck` on a guide example that no longer
# compiles (see tools/guideblocks.nim).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pushing again to an open PR cancels the previous commit's build, as in
# test.yml. Runs on main share one group and never cancel, so they deploy in
# order.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.4"
      - run: nimble docs
      - run: nimble docscheck
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: htmldocs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
