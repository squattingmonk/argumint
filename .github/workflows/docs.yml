name: Docs

# A pull request builds the docs without deploying them, so a broken doc
# comment or guide page fails review instead of the next deploy. `nimble docs`
# fails on any error `nim doc` or `md2html` reports (see `docExec` in
# argumint.nimble), and `nimble docscheck` on guide Markdown md2html renders
# differently from GitHub (see tools/guidelint.nim) or a guide example that no
# longer compiles (see tools/guideblocks.nim). markdownlint checks every
# Markdown file's line width (see .markdownlint-cli2.yaml); it runs here, not
# in test.yml, because test.yml skips Markdown-only changes.
#
# A push to `next` (the next major release) builds the docs as a check but
# never deploys them: the published site documents the released 1.x line.
on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pushing again to an open PR cancels the previous commit's build, as in
# test.yml. A PR groups by its number and a push by its branch, so a PR from
# main into next can't cancel a deploy; pushes never cancel, so main's runs
# deploy in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
      # The docs build on the oldest supported Nim, the one argumint.nimble
      # requires, like test.yml's `min` leg.
      - name: Resolve Nim version
        id: nim
        run: |
          v=$(tr -d '\r' < argumint.nimble | sed -n 's/^requires "nim >= \(.*\)"$/\1/p')
          [ -n "$v" ] || { echo "::error::no nim requirement in argumint.nimble"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ steps.nim.outputs.version }}
      - run: nimble docs
      # Fails on an uncommitted Public Surface change; see tests/api/README.md.
      - run: nimble surface
      - run: git diff --exit-code tests/api/surface.txt
      - run: nimble docscheck
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: htmldocs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
